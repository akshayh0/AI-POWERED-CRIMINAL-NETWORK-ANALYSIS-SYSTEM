<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Command Center | Karnataka State Police Intelligence</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Karnataka State Police AI-Driven Crime Analytics and Intelligence Command Platform. Real-time crime forecasting, repeat offender tracking, and criminal network analysis." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  </head>
  <body>
    <canvas id="ambient-network-bg" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const canvas = document.getElementById('ambient-network-bg');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let width = 0;
        let height = 0;
        let animId = null;
        const mediaReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        const pointCount = 36;
        const points = [];

        function initPoints() {
          points.length = 0;
          for (let i = 0; i < pointCount; i++) {
            points.push({
              x: Math.random() * (width || window.innerWidth),
              y: Math.random() * (height || window.innerHeight),
              vx: (Math.random() - 0.5) * 0.25,
              vy: (Math.random() - 0.5) * 0.25,
              radius: Math.random() * 0.8 + 1.2
            });
          }
        }

        resize();
        initPoints();

        let resizeTimeout;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(function() {
            resize();
            initPoints();
            if (mediaReducedMotion.matches) {
              render(false);
            }
          }, 150);
        });

        function render(animate) {
          ctx.clearRect(0, 0, width, height);

          const maxDist = 135;
          // Connecting lines
          for (let i = 0; i < points.length; i++) {
            for (let j = i + 1; j < points.length; j++) {
              const dx = points[i].x - points[j].x;
              const dy = points[i].y - points[j].y;
              const dist = Math.hypot(dx, dy);
              if (dist < maxDist) {
                const alpha = (1 - dist / maxDist) * 0.07;
                ctx.beginPath();
                ctx.moveTo(points[i].x, points[i].y);
                ctx.lineTo(points[j].x, points[j].y);
                ctx.strokeStyle = 'rgba(37, 99, 235, ' + alpha.toFixed(3) + ')';
                ctx.lineWidth = 0.75;
                ctx.stroke();
              }
            }
          }

          // Ambient nodes
          for (let i = 0; i < points.length; i++) {
            const p = points[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(37, 99, 235, 0.22)';
            ctx.fill();

            if (animate) {
              p.x += p.vx;
              p.y += p.vy;

              if (p.x < 0) p.x = width;
              else if (p.x > width) p.x = 0;

              if (p.y < 0) p.y = height;
              else if (p.y > height) p.y = 0;
            }
          }
        }

        function loop() {
          if (mediaReducedMotion.matches) {
            render(false);
            return;
          }
          render(true);
          animId = requestAnimationFrame(loop);
        }

        if (mediaReducedMotion.matches) {
          render(false);
        } else {
          loop();
        }

        if (mediaReducedMotion.addEventListener) {
          mediaReducedMotion.addEventListener('change', function(e) {
            if (animId) cancelAnimationFrame(animId);
            if (e.matches) {
              render(false);
            } else {
              loop();
            }
          });
        }
      })();
    </script>
  </body>
</html>
